name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 26.04 rather than latest: ':tmp' mounts need bubblewrap 0.11.0 or newer,
    # and 24.04 ships 0.9.0.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install bubblewrap and passt
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap passt

      - name: Allow unprivileged user namespaces
        # Ubuntu 23.10 and later ship an AppArmor policy that denies
        # unprivileged CLONE_NEWUSER, which is the one thing corral cannot do
        # without. A workstation gets the same failure; the difference is that
        # there it is the admin's call and here it is ours.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Check that pasta can run
        # Reported rather than required: the suite skips the four 'private'
        # assertions when the runner has no /dev/net/tun, and a silent skip is
        # how a network regression would get through unnoticed.
        run: |
          sudo modprobe tun || true
          pasta --config-net --no-map-gw --quiet -- /bin/true \
            && echo "pasta works; the private-mode assertions will run" \
            || echo "::warning::pasta cannot run here; private-mode assertions will skip"

      - name: Check that bwrap has the overlay options
        # Reported rather than required, for the same reason as pasta: the
        # suite skips the ':tmp' assertions on a bwrap without them.
        run: |
          bwrap --help | grep -q -- --tmp-overlay \
            && echo "bwrap has --tmp-overlay; the ':tmp' assertions will run" \
            || echo "::warning::bwrap has no --tmp-overlay; the ':tmp' assertions will skip"

      - name: Syntax check
        run: python3 -m py_compile corral

      - name: Run the property suite
        run: ./tests/corral-test
