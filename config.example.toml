# Copy to ~/.config/corral/config.toml (or $XDG_CONFIG_HOME/corral/config.toml).
# The file is optional, and so is each key. corral never writes it.
#
# Every value can use $(command), $NAME and ${NAME}. They expand on the host at
# every start; '$$' is a literal '$'. Stderr and this file keep the text as
# written, so a secret can come from a command without being stored here.

# Host directory that holds one $HOME per sandbox user.
homes = "~/.local/share/corral/homes"

# User to run as when --user is not given.
default_user = "corral"

# "private", "host" or "none".
network = "private"

# Command that prints the passphrase of an encrypted home, run with the sandbox
# user as its argument, '$1'. Without the key, corral asks on the terminal.
key_command = "pass show corral/$1"

# The interactive shell, also in the generated passwd and in SHELL. Without the
# key, $SHELL of the host, or /bin/bash when the sandbox cannot run $SHELL. A
# command after the options runs in 'bash -lc' with any shell.
shell = "/usr/bin/fish"

# Mounts for every sandbox, as HOST[:GUEST[:ro|rw|tmp]], the same as -m.
# HOST must be absolute or start with '~'. GUEST defaults to HOST, and the
# mode defaults to "ro". In GUEST, '~' is the sandbox home, so the "rw" entry
# below is one directory that every sandbox user shares. Every start prints
# these on stderr.
mounts = [
    "~/datasets:/data:ro",
    "~/.local/share/corral/shared:~/shared:rw",
    "/srv/cache:/cache:rw",
    "/etc/ssl::tmp",
]

# Variables for every sandbox, as NAME=VALUE or NAME, the same as -e. A bare
# NAME forwards the host's value and must be set on the host. Every start
# prints these on stderr, so forward a secret by name.
env = [
    "RUST_LOG=debug",
    "GH_TOKEN=$(pass github/token)",
]

# Paths to hide, added to /home, the real home and the built-in list of daemon
# sockets (Docker, containerd, podman, libvirt, pcscd, the system D-Bus). A
# file is covered with /dev/null. A directory gets an empty tmpfs, and the
# project and the mounts under it are bound back. Each must be absolute or
# start with '~'. A path that does not exist is ignored.
hide = [
    "/mnt/data/develop",
    "/run/user-daemon/control.sock",
]

# true binds the Wayland socket of the host, the same as -w. --no-wayland
# turns it off for one start. Without a display on the host, the start stops.
wayland = false

# Settings of one sandbox user, after the keys above. The file
# ~/.config/corral/users/NAME.toml holds the same keys and applies after this
# section. A user can set network, vpn, shell, mounts, env, hide and wayland.
[users.torrent]
network = "private"
# The wg-quick config of a WireGuard tunnel for all the traffic, the same as
# --vpn. It needs the "private" network mode.
vpn = "~/.config/wireguard/torrent.conf"
mounts = ["~/Downloads/torrent:~/Downloads:rw"]
